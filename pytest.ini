[pytest]
testpaths = tests
# Repo root on sys.path so `lib.*` and `tests.*` package imports work under plain `pytest` (CI) as well as `python3 -m pytest`.
pythonpath = .
markers =
    slow: marks tests that require Docker (deselect with '-m "not slow"')
    docker: needs a Docker daemon (always also slow; skipped locally when docker is absent, KARAKOS_REQUIRE_DOCKER=1 makes that a failure)
    realcli: tests that call the real claude CLI (spends a little; credential required; always also slow)
# tests/harness (fake `claude` + real agent-server) needs no marker: it runs
# in the normal unit job, needs no `claude` binary, and binds only 127.0.0.1.
# Docker and real-CLI tests carry `slow` plus their own marker, so the unit job's
# `-m "not slow"` is unchanged. The real-CLI gate is `-m "slow and realcli"`
# (plain `-m slow` would also pull in the Docker tests).
