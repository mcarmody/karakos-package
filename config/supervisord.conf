[supervisord]
nodaemon=true
logfile=/workspace/logs/supervisord.log
logfile_maxbytes=10MB
pidfile=/tmp/supervisord.pid

[program:agent-server]
command=python3 /workspace/bin/agent-server.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:relay]
command=python3 /workspace/bin/relay.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dashboard]
; Runs the pre-built Next.js app (karakos-dashboard at the ref pinned in
; dashboard.ref, built into the image). The source is not in the container, so
; there is nothing to rebuild in place: to change the dashboard, rebuild the
; image (see config/docker-compose.dev.yml) and recreate the container.
command=bash -c "npx next start -p ${DASHBOARD_PORT:-3000}"
directory=/workspace/dashboard
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=python3 /workspace/bin/scheduler.py
directory=/workspace
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
