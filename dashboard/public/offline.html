<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Karakos — unreachable</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #241c17;
    color: #f2e3d1;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
             max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    text-align: center;
  }
  main { max-width: 320px; }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
  p { color: #c9b8a4; font-size: 0.9rem; margin: 0; }
  button {
    margin-top: 20px;
    background: #e0a35c;
    color: #241c17;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    min-height: 44px;
  }
</style>
</head>
<body>
<main>
  <h1>Karakos is unreachable</h1>
  <p>No connection to the dashboard right now. Data doesn't go stale on
     this screen — it just won't load until the connection's back.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
